---
- name: Install Docker dependencies
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes
  become: yes

- name: Install Docker
  apt:
    name: docker.io
    state: present
  become: yes

- name: Install docker-compose
  apt:
    name: docker-compose
    state: present
  become: yes

- name: Install Python Docker SDK (для Ansible)
  apt:
    name: python3-docker
    state: present
  become: yes

- name: Enable and start Docker
  systemd:
    name: docker
    enabled: yes
    state: started
  become: yes

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes
  become: yes
