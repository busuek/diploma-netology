---
- name: Create elasticsearch data directory
  file:
    path: "{{ elasticsearch_data_dir }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: '0775'
  become: yes

- name: Run Elasticsearch container with security enabled
  docker_container:
    name: elasticsearch
    image: "docker.elastic.co/elasticsearch/elasticsearch:{{ elastic_version }}"
    state: started
    restart_policy: always
    ports:
      - "9200:9200"
      - "9300:9300"
    env:
      discovery.type: "single-node"
      xpack.security.enabled: "true"
      xpack.security.enrollment.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: "{{ elastic_password }}"
      ES_JAVA_OPTS: "-Xms{{ elasticsearch_heap }} -Xmx{{ elasticsearch_heap }}"
    volumes:
      - "{{ elasticsearch_data_dir }}:/usr/share/elasticsearch/data"
  become: yes

- name: Wait for Elasticsearch to be ready
  uri:
    url: "http://localhost:9200"
    user: "elastic"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    status_code: 200
  register: es_result
  until: es_result.status == 200
  retries: 30
  delay: 10
  become: yes

- name: Set kibana_system password
  uri:
    url: "http://localhost:9200/_security/user/kibana_system/_password"
    method: POST
    user: "elastic"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    body_format: json
    body:
      password: "{{ kibana_password }}"
    status_code: 200
  become: yes
